<style>
:root{--bg1:#2c0b17;--bg2:#10030a;--ink:#f2c9d3;--glow:#ff6f9c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.msg{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 22px);text-align:center;color:var(--ink);pointer-events:none;transition:opacity .9s ease,transform 1.2s ease}

#love{font-size:clamp(46px,15vw,104px);font-weight:600;color:#ffd9e4;text-shadow:0 0 18px var(--glow),0 0 48px var(--glow);opacity:0;transform:translateY(12px) scale(.94);line-height:1.1}
body.done #hint{opacity:0}
body.done #love{opacity:1;transform:none}
</style>

<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W,H,dpr,bg,flowers=[],clicks=0,t0=performance.now();
var music=document.getElementById('bgMusic');
var calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var spd=calm?2.5:1;
var stars=[];
function rnd(a,b){return a+Math.random()*(b-a)}
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  bg=ctx.createRadialGradient(W/2,H*.55,0,W/2,H*.55,Math.max(W,H)*.75);
  bg.addColorStop(0,'#2c0b17');bg.addColorStop(1,'#10030a');
  stars=[];for(var i=0;i<70;i++)stars.push({x:Math.random(),y:Math.random(),r:rnd(.6,2),p:rnd(0,6.28),s:rnd(.4,1.2)});
}
addEventListener('resize',resize);resize();

var ease=function(t){return 1-Math.pow(1-t,3)};
var back=function(t){var c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
var clamp=function(v){return Math.max(0,Math.min(1,v))};

function plant(x,y){
  var R=Math.min(W,H)*rnd(.038,.052);
  y=Math.min(y,H-R*3);
  var bx=W/2+(x-W/2)*.12+rnd(-10,10),by=H+4;
  var mid=(bx+x)/2+rnd(-.12,.12)*H;
  flowers.push({x:x,y:y,bx:bx,by:by,cx:mid,cy:(by+y)/2+rnd(0,.12)*H,R:R,type:Math.floor(Math.random()*4),rot:rnd(0,6.28),born:performance.now(),
    leaves:[{t:.28,s:-1},{t:.46,s:1},{t:.64,s:-1}].map(function(l){return{t:l.t+rnd(-.04,.04),s:l.s,L:R*rnd(.9,1.35)}})});
}
function pt(f,t){
  var u=1-t;
  return{x:u*u*f.bx+2*u*t*f.cx+t*t*f.x,y:u*u*f.by+2*u*t*f.cy+t*t*f.y};
}
function tan(f,t){
  var u=1-t;
  var dx=2*u*(f.cx-f.bx)+2*t*(f.x-f.cx),dy=2*u*(f.cy-f.by)+2*t*(f.y-f.cy);
  return Math.atan2(dy,dx);
}
function drawStem(f,p){
  ctx.save();ctx.lineCap='round';ctx.strokeStyle='#3f9a4c';ctx.lineWidth=Math.max(2,f.R*.12);
  ctx.beginPath();var n=44,m=Math.max(2,Math.round(n*p));
  for(var i=0;i<=m;i++){var q=pt(f,p*i/m);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)}
  ctx.stroke();ctx.restore();
  f.leaves.forEach(function(l){
    var k=clamp((p-l.t)*5);if(k<=0)return;
    var q=pt(f,l.t),a=tan(f,l.t)+l.s*0.85,L=l.L*ease(k);
    ctx.save();ctx.translate(q.x,q.y);ctx.rotate(a);
    ctx.fillStyle='#4aab55';ctx.beginPath();ctx.moveTo(0,0);
    ctx.bezierCurveTo(L*.3,-L*.32,L*.75,-L*.3,L,0);
    ctx.bezierCurveTo(L*.75,L*.3,L*.3,L*.32,0,0);ctx.fill();ctx.restore();
  });
}
function petals(n,len,wid,col,pointy){
  ctx.fillStyle=col;
  for(var i=0;i<n;i++){
    ctx.save();ctx.rotate(i/n*6.2832);ctx.beginPath();
    if(pointy){ctx.moveTo(0,-len*.25);ctx.quadraticCurveTo(wid,-len*.7,0,-len);ctx.quadraticCurveTo(-wid,-len*.7,0,-len*.25)}
    else ctx.ellipse(0,-len*.62,wid,len*.4,0,0,6.2832);
    ctx.fill();ctx.restore();
  }
}
function drawHead(f,s,now){
  var r=f.R*s,sw=Math.sin(now/900+f.rot)*.06;
  ctx.save();ctx.translate(f.x,f.y);ctx.rotate(sw);
  if(f.type===0){
    ctx.shadowColor='rgba(255,255,255,.7)';ctx.shadowBlur=r*.9;
    petals(16,r*1.25,r*.17,'#fff',false);ctx.shadowBlur=0;
    var g=ctx.createRadialGradient(0,0,0,0,0,r*.4);g.addColorStop(0,'#ffe066');g.addColorStop(1,'#f0a020');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*.38,0,6.2832);ctx.fill();
  }else if(f.type===1){
    ctx.shadowColor='rgba(255,200,40,.8)';ctx.shadowBlur=r;
    petals(22,r*1.45,r*.2,'#ffc21a',true);petals(22,r*1.2,r*.16,'#ffd84d',true);ctx.shadowBlur=0;
    var h=ctx.createRadialGradient(0,0,0,0,0,r*.6);h.addColorStop(0,'#2a1206');h.addColorStop(.7,'#5b2c0d');h.addColorStop(1,'#8a4a14');
    ctx.fillStyle=h;ctx.beginPath();ctx.arc(0,0,r*.6,0,6.2832);ctx.fill();
  }else if(f.type===2){
    ctx.rotate(-sw);
    var w=r*.8,hh=r*1.25;
    ctx.shadowColor='rgba(255,110,170,.9)';ctx.shadowBlur=r*1.1;
    var tg=ctx.createLinearGradient(0,-hh,0,hh*.4);tg.addColorStop(0,'#ff9ec4');tg.addColorStop(1,'#e84c8a');
    ctx.fillStyle=tg;ctx.beginPath();
    ctx.moveTo(-w,-hh*.55);ctx.lineTo(-w*.45,-hh*.12);ctx.lineTo(0,-hh*.7);ctx.lineTo(w*.45,-hh*.12);ctx.lineTo(w,-hh*.55);
    ctx.bezierCurveTo(w*1.05,hh*.2,w*.5,hh*.55,0,hh*.55);ctx.bezierCurveTo(-w*.5,hh*.55,-w*1.05,hh*.2,-w,-hh*.55);
    ctx.fill();ctx.shadowBlur=0;
  }else{
    ctx.shadowColor='rgba(255,30,60,.95)';ctx.shadowBlur=r*1.6;
    var pg=ctx.createRadialGradient(0,0,0,0,0,r*1.4);pg.addColorStop(0,'#d4102f');pg.addColorStop(.6,'#ff2a4d');pg.addColorStop(1,'#ff4d6a');
    ctx.fillStyle=pg;ctx.beginPath();
    for(var i=0;i<=48;i++){var a=i/48*6.2832,rr=r*1.35*(1+.05*Math.sin(a*7+f.rot));i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr)}
    ctx.fill();ctx.shadowBlur=0;
  }
  ctx.restore();
}
function frame(now){
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(var i=0;i<stars.length;i++){
    var s=stars[i],a=.25+.45*(.5+.5*Math.sin(now/1000*s.s+s.p));
    ctx.fillStyle='rgba(255,230,235,'+a.toFixed(3)+')';
    ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.2832);ctx.fill();
  }
  for(var j=0;j<flowers.length;j++){
    var f=flowers[j],age=(now-f.born)*spd;
    drawStem(f,ease(clamp(age/2000)));
    var hs=clamp((age-1700)/800);
    if(hs>0)drawHead(f,back(hs),now);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('pointerdown',function(e){
  if(clicks>=5)return;
  plant(e.clientX,e.clientY);
  clicks++;
  if(clicks===5){
    document.body.classList.add('done');
    music.currentTime=0;
    var playPromise=music.play();
    if(playPromise&&typeof playPromise.catch==='function'){
      playPromise.catch(function(err){console.warn('Audio tidak dapat diputar:',err);});
    }
  }
});
})();
